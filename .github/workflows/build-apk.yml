name: Build Signed One UI 9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android 15 / One UI 9 Project
        shell: python
        run: |
          import glob, os, shutil, zipfile

          os.makedirs("app/src/main/java/com/swipeclean/app/ui", exist_ok=True)
          os.makedirs("app/src/main/java/com/swipeclean/app/worker", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          for zpath in glob.glob("*.zip"):
              try:
                  with zipfile.ZipFile(zpath, "r") as zf:
                      for member in zf.namelist():
                          if member.endswith("swipeclean_mobile_app.html"):
                              data = zf.read(member)
                              with open("app/src/main/assets/swipeclean_mobile_app.html", "wb") as out:
                                  out.write(data)
              except Exception as e:
                  print("Zip warning:", e)

          if os.path.exists("swipeclean_mobile_app.html"):
              shutil.copyfile("swipeclean_mobile_app.html", "app/src/main/assets/swipeclean_mobile_app.html")

          open("settings.gradle.kts", "w").write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SwipeClean"
          include(":app")
          ''')

          open("build.gradle.kts", "w").write('''plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ''')

          open("gradle.properties", "w").write('''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''')

          open("app/build.gradle.kts", "w").write('''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.swipeclean.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.swipeclean.app"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.work:work-runtime-ktx:2.9.1")
          }
          ''')

          open("app/src/main/AndroidManifest.xml", "w").write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <application
                  android:label="SwipeClean"
                  android:enableOnBackInvokedCallback="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          open("app/src/main/java/com/swipeclean/app/worker/TrashExpiryWorker.kt", "w").write('''package com.swipeclean.app.worker
          import android.content.Context
          import androidx.work.*
          import java.io.File
          import java.util.concurrent.TimeUnit

          class TrashExpiryWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              companion object {
                  const val RETENTION_DAYS = 15L
                  val RETENTION_MS = TimeUnit.DAYS.toMillis(RETENTION_DAYS)
                  fun schedule(context: Context) {
                      val req = PeriodicWorkRequestBuilder<TrashExpiryWorker>(6, TimeUnit.HOURS).build()
                      WorkManager.getInstance(context).enqueueUniquePeriodicWork("SwipeClean15d", ExistingPeriodicWorkPolicy.KEEP, req)
                  }
              }
              override suspend fun doWork(): Result {
                  val vaultDir = File(applicationContext.getExternalFilesDir(null), ".swipeclean_vault")
                  if (!vaultDir.exists()) return Result.success()
                  val now = System.currentTimeMillis()
                  vaultDir.listFiles()?.forEach { f ->
                      if (now - f.lastModified() >= RETENTION_MS) f.delete()
                  }
                  return Result.success()
              }
          }
          ''')

          open("app/src/main/java/com/swipeclean/app/ui/MainActivity.kt", "w").write('''package com.swipeclean.app.ui
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import com.swipeclean.app.worker.TrashExpiryWorker

          class MainActivity : ComponentActivity() {
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null

              private val filePickerLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val callback = fileUploadCallback ?: return@registerForActivityResult
                  fileUploadCallback = null
                  if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                      val data = result.data!!
                      val clipData = data.clipData
                      if (clipData != null) {
                          val uris = Array(clipData.itemCount) { i -> clipData.getItemAt(i).uri }
                          callback.onReceiveValue(uris)
                      } else if (data.data != null) {
                          callback.onReceiveValue(arrayOf(data.data!!))
                      } else
