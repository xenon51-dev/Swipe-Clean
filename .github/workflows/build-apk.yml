name: Build Signed One UI 9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android 15 / One UI 9 Project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "Unpacking ${zips[0]}..."
            unzip -o "${zips[0]}" || true
            if [ -d "swipeclean_oneui9_source" ]; then
              cp -r swipeclean_oneui9_source/* . || true
            elif [ -d "swipeclean_android15_source" ]; then
              cp -r swipeclean_android15_source/* . || true
            fi
          fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SwipeClean"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          mkdir -p app/src/main/java/com/swipeclean/app/ui
          mkdir -p app/src/main/java/com/swipeclean/app/worker
          mkdir -p app/src/main/assets

          rm -f app/src/main/java/com/swipeclean/app/ui/SwipeDeckScreen.kt
          rm -f app/src/main/java/com/swipeclean/app/data/CleanableFileItem.kt

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.swipeclean.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.swipeclean.app"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.work:work-runtime-ktx:2.9.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <application
                  android:label="SwipeClean"
                  android:enableOnBackInvokedCallback="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/swipeclean/app/worker/TrashExpiryWorker.kt
          package com.swipeclean.app.worker
          import android.content.Context
          import androidx.work.*
          import java.io.File
          import java.util.concurrent.TimeUnit

          class TrashExpiryWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              companion object {
                  const val RETENTION_DAYS = 15L
                  val RETENTION_MS = TimeUnit.DAYS.toMillis(RETENTION_DAYS)
                  fun schedule(context: Context) {
                      val req = PeriodicWorkRequestBuilder<TrashExpiryWorker>(6, TimeUnit.HOURS).build()
                      WorkManager.getInstance(context).enqueueUniquePeriodicWork("SwipeClean15d", ExistingPeriodicWorkPolicy.KEEP, req)
                  }
              }
              override suspend fun doWork(): Result {
                  val vaultDir = File(applicationContext.getExternalFilesDir(null), ".swipeclean_vault")
                  if (!vaultDir.exists()) return Result.success()
                  val now = System.currentTimeMillis()
                  vaultDir.listFiles()?.forEach { f ->
                      if (now - f.lastModified() >= RETENTION_MS) f.delete()
                  }
                  return Result.success()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/swipeclean/app/ui/MainActivity.kt
          package com.swipeclean.app.ui
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import com.swipeclean.app.worker.TrashExpiryWorker

          class MainActivity : ComponentActivity() {
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null

              private val filePickerLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val callback = fileUploadCallback ?: return@registerForActivityResult
                  fileUploadCallback = null
                  if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                      val data = result.data!!
                      val clipData = data.clipData
                      if (clipData != null) {
                          val uris = Array(clipData.itemCount) { i -> clipData.getItemAt(i).uri }
                          callback.onReceiveValue(uris)
                      } else if (data.data != null) {
                          callback.onReceiveValue(arrayOf(data.data!!))
                      } else {
                          callback.onReceiveValue(null)
                      }
                  } else {
                      callback.onReceiveValue(null)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  TrashExpiryWorker.schedule(applicationContext)

                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      settings.allowContentAccess = true
                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onShowFileChooser(
                              webView: WebView?,
                              filePathCallback: ValueCallback<Array<Uri>>?,
                              fileChooserParams: FileChooserParams?
                          ): Boolean {
                              fileUploadCallback?.onReceiveValue(null)
                              fileUploadCallback = filePathCallback
                              val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                                  putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                              }
                              filePickerLauncher.launch(Intent.createChooser(intent, "Select Phone Files to Clean"))
                              return true
                          }
                      }
                      loadUrl("file:///android_asset/swipeclean_mobile_app.html")
                  }
                  setContentView(webView)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Signed One UI 9 APK
        run: gradle assembleDebug

      - name: Upload Installable One UI 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-OneUI9-APK
          path: app/build/outputs/apk/debug/app-debug.apk
